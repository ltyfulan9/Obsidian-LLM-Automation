name: Cross-platform tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: knowledge --version
      - name: Check native macOS plist
        if: runner.os == 'macOS'
        run: |
          python -c "import os; from pathlib import Path; from knowledge.schedule import definition; Path(os.environ['RUNNER_TEMP'], 'knowledge-test.plist').write_text(definition(Path('/synthetic/wiki'), 'macos', 21, 0, interval_minutes=30), encoding='utf-8')"
          plutil -lint "$RUNNER_TEMP/knowledge-test.plist"
